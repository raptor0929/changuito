[workspace]
resolver = "2"
members = ["escrow", "mock_usdc"]

[workspace.dependencies]
# Pinned to the local `stellar` CLI (25.1.0). A contract built by a newer SDK
# than the CLI that deploys it is a confusing class of build error, and the
# protocol accepts an older env meta version than the ledger's anyway.
soroban-sdk = "25.3.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
