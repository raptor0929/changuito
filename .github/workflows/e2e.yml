name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly production smoke. Drop this block if the schedule is unwanted.
    - cron: '0 12 * * 1'

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-and-e2e:
    name: Unit tests and Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm run test:e2e
        env:
          CI: true
          LANDING_BASE_URL: https://www.changuito.me
          APP_BASE_URL: https://app.changuito.me
          CHANGUTO_E2E_EMAIL: ${{ secrets.CHANGUTO_E2E_EMAIL }}
          CHANGUTO_E2E_PASSWORD: ${{ secrets.CHANGUTO_E2E_PASSWORD }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
